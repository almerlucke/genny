name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # the plotting code has its own modules, so that the library itself has no dependencies
      - name: plot modules
        run: |
          for d in float/export/plot examples/plot examples/plotmusic; do
            (cd $d && GOWORK=off go vet ./... && GOWORK=off go test ./...)
          done
